{% extends 'base.html' %}
{% block title %}Emergency Hotlines — LigtasPH{% endblock %}
{% block content %}
<h1 style="margin:0 0 8px;">Emergency Hotlines</h1>
<div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;">
  <input id="q" placeholder="Search agency, number, area" style="flex:1; min-width:200px;">
  <select id="city"><option value="">All cities</option><option>National</option><option>Marikina</option><option>Quezon City</option><option>Pasig</option><option>Makati</option><option>Mandaluyong</option><option>Manila</option><option>Taguig</option><option>Pasay</option><option>Parañaque</option><option>Las Piñas</option><option>Muntinlupa</option><option>Valenzuela</option><option>Caloocan</option><option>Malabon</option><option>Navotas</option><option>San Juan</option><option>Pateros</option></select>
  <select id="cat"><option value="">All categories</option><option>National</option><option>DRRMO</option><option>Police</option><option>Fire</option><option>Medical</option><option>Rescue</option><option>Hospital</option><option>Utility</option></select>
</div>
<div id="grid" class="grid-3"></div>
<div id="empty" style="display:none; color:var(--text-secondary); padding:20px; text-align:center; border:1px dashed var(--border); border-radius:8px; margin-top:12px;">No hotline records for this locality.</div>
{% endblock %}
{% block scripts %}
<script>
let all=[];
// Hotline fields are admin-entered and rendered for every visitor — escape
// before injecting into card HTML to avoid stored XSS (GH #6).
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
document.addEventListener('DOMContentLoaded', async()=>{
  await load();
  document.getElementById('q').addEventListener('input', load);
  document.getElementById('city').addEventListener('change', load);
  document.getElementById('city').addEventListener('change', (e)=>{ try{ localStorage.setItem('ligtasph_ann_city_v1', e.target.value || ''); }catch(_){} });
  document.getElementById('cat').addEventListener('change', load);
  // Revalidate on the shared SYNC_MS cadence (skips while typing: load()
  // reads the live filter inputs, so a tick never clobbers user input).
  try{
    let ms=5*60*1000;
    if(window.LigtasPrefs && window.LigtasPrefs.SYNC_MS) ms=window.LigtasPrefs.SYNC_MS;
    const tick=()=>{ load().catch(()=>{}); };
    if(window.LigtasPrefs && window.LigtasPrefs.everyVisible) window.LigtasPrefs.everyVisible(ms, tick);
    else setInterval(()=>{ if(!document.hidden) tick(); }, ms);
  }catch(e){}
});
async function load(){
  const q=document.getElementById('q').value.trim();
  const city=document.getElementById('city').value;
  const cat=document.getElementById('cat').value;
  const params=new URLSearchParams();
  if(q) params.set('q', q);
  if(city) params.set('city', city);
  if(cat) params.set('category', cat);
  const res=await fetch('/api/hotlines?'+params.toString());
  const data=await res.json();
  const grid=document.getElementById('grid');
  const empty=document.getElementById('empty');
  grid.innerHTML='';
  if(data.length===0){ empty.style.display='block'; return;} else empty.style.display='none';
  data.forEach(h=>{
    const card=document.createElement('div');
    card.className='card';
    // Hotline fields are admin-entered and rendered for every visitor —
    // escape all of them, including inside tel: hrefs (GH #6).
    const tel=esc(h.contact_number);
    card.innerHTML=`
      <div style="display:flex; justify-content:space-between; gap:8px;"><div style="font-weight:800;">${esc(h.agency)}</div><span class="badge badge-unknown">${esc(h.category)}</span></div>
      <div style="color:var(--text-secondary); font-size:13px;">${esc(h.city)} • ${esc(h.address_area||'')}</div>
      <div style="font-weight:700; font-size:16px; margin:6px 0;"><a href="tel:${tel}" style="color:var(--primary); text-decoration:none;">${tel}</a></div>
      <div style="display:flex; gap:8px;"><button class="btn btn-secondary copyBtn" style="flex:1; padding:6px;">Copy Number</button><a href="tel:${tel}" class="btn btn-primary" style="flex:1; padding:6px;">Call</a></div>
      <div style="color:var(--text-secondary); font-size:12px; margin-top:6px;">Verified: ${esc(h.last_verified||h.updated_at||'')} ${h.verification_note? '• '+esc(h.verification_note):''}</div>
    `;
    card.querySelector('.copyBtn').addEventListener('click', async()=>{ try{ await navigator.clipboard.writeText(h.contact_number); card.querySelector('.copyBtn').textContent='Copied!'; setTimeout(()=>card.querySelector('.copyBtn').textContent='Copy Number',1500);}catch(e){ alert('Copy failed'); }});
    grid.appendChild(card);
  });
}
</script>
{% endblock %}
