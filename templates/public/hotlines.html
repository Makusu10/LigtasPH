{% extends 'base.html' %}
{% block title %}Emergency Hotlines — LigtasPH{% endblock %}
{% block content %}
<h1 style="margin:0 0 8px;">Emergency Hotlines</h1>
<div class="emergency-strip">
  <div>
    <span class="strip-tag">Life-threatening emergency</span>
    <span class="strip-copy">Call 911 now — do not wait</span>
  </div>
  <a href="tel:911" class="btn btn-primary btn-lg">Call 911</a>
</div>
<div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;">
  <input id="q" placeholder="Search agency, number, area" style="flex:1; min-width:200px;">
  <select id="city"><option value="">All cities</option><option>National</option><option>Marikina</option><option>Quezon City</option><option>Pasig</option><option>Makati</option><option>Mandaluyong</option></select>
  <select id="cat"><option value="">All categories</option><option>National</option><option>DRRMO</option><option>Police</option><option>Fire</option><option>Medical</option><option>Rescue</option><option>Hospital</option><option>Utility</option></select>
</div>
<div id="grid" class="grid-3"></div>
<div id="empty" style="display:none; color:var(--text-secondary); padding:20px; text-align:center; border:2px dashed var(--line); border-radius:2px; margin-top:12px;">No hotline records for this locality.</div>
{% endblock %}
{% block scripts %}
<script>
let all=[];
document.addEventListener('DOMContentLoaded', async()=>{
  await load();
  document.getElementById('q').addEventListener('input', load);
  document.getElementById('city').addEventListener('change', load);
  document.getElementById('city').addEventListener('change', (e)=>{ try{ localStorage.setItem('ligtasph_ann_city_v1', e.target.value || ''); }catch(_){} });
  document.getElementById('cat').addEventListener('change', load);
});
async function load(){
  const q=document.getElementById('q').value.trim();
  const city=document.getElementById('city').value;
  const cat=document.getElementById('cat').value;
  const params=new URLSearchParams();
  if(q) params.set('q', q);
  if(city) params.set('city', city);
  if(cat) params.set('category', cat);
  const res=await fetch('/api/hotlines?'+params.toString());
  const data=await res.json();
  const grid=document.getElementById('grid');
  const empty=document.getElementById('empty');
  grid.innerHTML='';
  if(data.length===0){ empty.style.display='block'; return;} else empty.style.display='none';
  data.forEach(h=>{
    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=`
      <div style="display:flex; justify-content:space-between; gap:8px;"><div style="font-weight:800;">${h.agency}</div><span class="badge badge-unknown">${h.category}</span></div>
      <div style="color:var(--text-secondary); font-size:13px;">${h.city} • ${h.address_area||''}</div>
      <div style="font-weight:700; font-size:16px; margin:6px 0;"><a href="tel:${h.contact_number}" style="color:var(--primary); text-decoration:none;">${h.contact_number}</a></div>
      <div style="display:flex; gap:8px;"><button class="btn btn-secondary copyBtn" style="flex:1; padding:6px;">Copy Number</button><a href="tel:${h.contact_number}" class="btn btn-primary" style="flex:1; padding:6px;">Call</a></div>
      <div style="color:var(--text-secondary); font-size:12px; margin-top:6px;">Verified: ${h.last_verified||h.updated_at||''} ${h.verification_note? '• '+h.verification_note:''}</div>
    `;
    card.querySelector('.copyBtn').addEventListener('click', async()=>{ try{ await navigator.clipboard.writeText(h.contact_number); card.querySelector('.copyBtn').textContent='Copied!'; setTimeout(()=>card.querySelector('.copyBtn').textContent='Copy Number',1500);}catch(e){ alert('Copy failed'); }});
    grid.appendChild(card);
  });
}
</script>
{% endblock %}
