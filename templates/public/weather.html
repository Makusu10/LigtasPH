{% extends 'base.html' %}
{% block title %}Weather — LigtasPH{% endblock %}
{% block content %}
<h1 style="margin:0 0 8px;">Weather</h1>
<p style="color:var(--text-secondary); margin:0 0 12px;">Uses OpenWeather (primary, free key) → Open-Meteo (no key) → NOAA supplement. API key never exposed.</p>
<div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;">
  <button id="locBtn" class="btn btn-secondary">Use My Location</button>
  <input id="cityInput" placeholder="City (e.g. Marikina)" style="flex:1; min-width:160px;">
  <button id="fetchBtn" class="btn btn-primary">Fetch Weather</button>
</div>
<div id="status" style="color:var(--text-secondary); font-size:13px;"></div>
<div id="card" class="card" style="display:none; margin-top:12px;"></div>
<div id="error" class="card" style="display:none; margin-top:12px; background:#FEF3F2; border-color:#FECDCA;"></div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('locBtn').addEventListener('click', ()=>{
  if(!navigator.geolocation){ document.getElementById('status').textContent='Geolocation not supported. Enter city manually.'; return; }
  navigator.geolocation.getCurrentPosition(async pos=>{
    await fetchWeather(pos.coords.latitude, pos.coords.longitude, null);
  }, err=>{ document.getElementById('status').textContent='Location denied. Enter city manually.'; }, {timeout:8000});
});
document.getElementById('fetchBtn').addEventListener('click', ()=>{
  const city=document.getElementById('cityInput').value.trim();
  if(city) fetchWeather(null,null,city);
  else fetchWeather(14.6308,121.0968,null);
});

async function fetchWeather(lat, lon, city){
  const status=document.getElementById('status');
  const card=document.getElementById('card');
  const err=document.getElementById('error');
  card.style.display='none'; err.style.display='none';
  status.textContent='Fetching weather...';
  let url='/api/weather?';
  if(city) url+=`city=${encodeURIComponent(city)}&lat=14.6308&lon=121.0968`;
  else url+=`lat=${lat}&lon=${lon}`;
  try{
    const res=await fetch(url);
    const data=await res.json();
    if(!res.ok){ throw new Error(data.error || 'Weather unavailable'); }
    status.textContent='';
    card.style.display='block';
    card.innerHTML=`
      <div style="display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;">
        <div>
          <div style="font-weight:800; font-size:18px;">${data.name || city || (lat+","+lon)}</div>
          <div style="color:var(--text-secondary); font-size:13px;">Source: ${data.source || data._cache_source || 'weather'} • ${data.fetched_at || ''}</div>
        </div>
        <span class="badge badge-available">${data.weather?.[0]?.description || ''}</span>
      </div>
      <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin-top:12px;">
        <div><div style="color:var(--text-secondary); font-size:12px; text-transform:uppercase; font-weight:700;">Temperature</div><div style="font-size:22px; font-weight:800;">${data.main?.temp ?? ''}°C</div><div style="font-size:12px;">Feels like ${data.main?.feels_like ?? ''}°C</div></div>
        <div><div style="color:var(--text-secondary); font-size:12px; text-transform:uppercase; font-weight:700;">Humidity</div><div style="font-size:22px; font-weight:800;">${data.main?.humidity ?? ''}%</div></div>
        <div><div style="color:var(--text-secondary); font-size:12px; text-transform:uppercase; font-weight:700;">Wind</div><div style="font-size:22px; font-weight:800;">${data.wind?.speed ?? ''} m/s</div></div>
      </div>
      ${data._stale ? '<div style="color:var(--orange); font-size:12px; margin-top:8px;">Showing stale cached data.</div>' : ''}
    `;
  }catch(e){
    status.textContent='';
    err.style.display='block';
    err.innerHTML=`<div style="font-weight:700; color:var(--red);">Weather unavailable</div><div style="color:var(--text-secondary);">${e.message}</div><button class="btn btn-secondary" style="margin-top:8px;" onclick="fetchWeather(${lat||14.6308},${lon||121.0968},${city?`'${city}'`: 'null'})">Retry</button>`;
  }
}
// auto fetch default
fetchWeather(14.6308,121.0968,null);
</script>
{% endblock %}
